[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-jira-status-report"
version = "0.1.0"
description = "Generate weekly stakeholder status reports from Jira."
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.scripts]
weekly-status-report = "status_reporter.cli:main"

[tool.setuptools.packages.find]
include = ["status_reporter*"]
